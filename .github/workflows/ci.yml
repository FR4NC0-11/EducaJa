name: Verificar aplicação
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: educaja
          POSTGRES_DB: educaja
          POSTGRES_PASSWORD: educaja_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educaja -d educaja"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://educaja:educaja_ci_only@localhost:5432/educaja
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Confirmar reaplicação segura das migrações
        run: npm run db:migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verificar integração da IA com provedor simulado (sem chamadas pagas)
        run: npm run test:ai-integration
